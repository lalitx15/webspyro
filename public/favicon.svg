<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#030712" />
      <stop offset="100%" stopColor="#0B132B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00F2FE" />
      <stop offset="50%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#67E8F9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Neon Border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#brandGrad)" stroke-width="12" stroke-opacity="0.6" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="270" r="140" fill="#06B6D4" opacity="0.18" filter="url(#glow)" />

  <!-- Modern Sharp Geometric 'W' Monogram -->
  <path 
    d="M 112 152 
       L 172 376 
       L 256 236 
       L 340 376 
       L 400 152" 
    stroke="url(#brandGrad)" 
    stroke-width="52" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Center Top Glowing Cyber Nexus Sparkle -->
  <path
    d="M 256 104 
       Q 256 152 280 152 
       Q 256 152 256 200 
       Q 256 152 232 152 
       Q 256 152 256 104 Z"
    fill="url(#sparkleGrad)"
  />
  <circle cx="256" cy="152" r="7" fill="#FFFFFF" />
</svg>
